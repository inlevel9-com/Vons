name: Reproduction report
description: Report a scoped attempt to reproduce a documented behavior or result.
title: "[Reproduction] "
body:
  - type: markdown
    attributes:
      value: |
        An unsuccessful reproduction is useful. Keep raw records locally and
        publish only permitted, reviewed aggregates or synthetic examples.
        English and Korean reports are welcome. Missing evidence is unavailable.
  - type: textarea
    id: claim
    attributes:
      label: Claim and source
      description: Link the exact document/version and state the claim's scope and expected result.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Versions, inputs and environment
      description: Source revision or manifest, model/tokenizer hashes if used, permitted input provenance, split, seed, OS/device/runtime/provider. Do not attach restricted inputs.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Commands and measurement procedure
      description: Include warm-up, repetitions, timing or memory scope and analysis choices where applicable.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Observed results and denominators
      description: Attempts, successes, abstentions, failures and unavailable values; include definitions, mismatches and limitations. Separate targets from measurements.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional permitted evidence
      description: Safe aggregate report or synthetic fixture with hashes; state what cannot be shared or independently checked.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public content check
      options:
        - label: I reviewed the report and attachments for secrets, personal information and restricted material, and may share them.
          required: true
