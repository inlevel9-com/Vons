name: Source checks

on:
  push:
    paths:
      - '.github/workflows/checks.yml'
      - 'vons/**'
      - 'tools/**'
      - 'tests/**'
      - 'configs/**'
      - 'sdk/**'
      - 'docs/assets/inlevel9-signature.png'
      - 'docs/assets/vons-extension-icon-*.png'
      - 'pyproject.toml'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/checks.yml'
      - 'vons/**'
      - 'tools/**'
      - 'tests/**'
      - 'configs/**'
      - 'sdk/**'
      - 'docs/assets/inlevel9-signature.png'
      - 'docs/assets/vons-extension-icon-*.png'
      - 'pyproject.toml'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]' numpy onnx onnxruntime
      - run: python tools/prepare_public_release.py
      - run: ruff check .
      - run: python -m pytest -q
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:browser
      - run: npm run build:benchmark
      - run: npm run build:parity
      - run: npm run typecheck:extension
      - run: npm run build:extension
